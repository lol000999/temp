<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ôn tập Hóa học HKII – Hydrocarbon & Dẫn xuất | Trắc nghiệm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1rem;
            color: #0f172a;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .quiz-header h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .quiz-header p {
            color: #334155;
            font-weight: 500;
            border-bottom: 2px solid #cbd5e1;
            display: inline-block;
            padding-bottom: 6px;
        }

        /* Progress + filter */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            background: white;
            padding: 0.8rem 1.2rem;
            border-radius: 32px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .badge {
            background: #e0f2fe;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0369a1;
        }

        .reset-btn {
            background: none;
            border: 1px solid #cbd5e1;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            color: #1e293b;
        }

        .reset-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        /* Question card */
        .question-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            margin-bottom: 1.8rem;
            padding: 1.5rem 1.5rem 1.2rem 1.5rem;
            transition: all 0.15s ease;
            border: 1px solid #e2e8f0;
        }

        .question-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .q-num {
            background: #2d6a4f20;
            color: #1f5e3a;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .q-text {
            font-weight: 600;
            line-height: 1.4;
            color: #0c4a6e;
        }

        .options {
            margin: 1rem 0 1rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            padding: 6px 8px;
            border-radius: 40px;
            transition: background 0.1s;
            cursor: pointer;
        }

        .option:hover {
            background: #f8fafc;
        }

        input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
            cursor: pointer;
        }

        .feedback {
            margin-top: 0.9rem;
            padding: 0.7rem 1rem;
            border-radius: 24px;
            font-size: 0.9rem;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 5px solid #cbd5e1;
        }

        .feedback.correct {
            background: #e6f9ed;
            border-left-color: #2e7d32;
            color: #1e4620;
        }

        .feedback.wrong {
            background: #ffeaea;
            border-left-color: #c62828;
            color: #9b2c1d;
        }

        .check-btn {
            background: #2c7da0;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .check-btn:hover {
            background: #1f5e7e;
        }

        .explain {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        hr {
            margin: 2rem 0 0.5rem;
            border-color: #e2e8f0;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #475569;
            margin-top: 2rem;
            padding-top: 0.8rem;
        }
        @media (max-width: 640px) {
            .question-card {
                padding: 1rem;
            }
            .options {
                margin-left: 0.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="quiz-header">
        <h1>📘 Ôn tập cuối học kỳ II</h1>
        <p>Hydrocarbon • Dẫn xuất halogen • Alcohol • Phenol • Carbonyl</p>
    </div>
    <div class="info-bar">
        <div class="badge">✅ 30 câu trắc nghiệm | Chọn đáp án & kiểm tra</div>
        <button class="reset-btn" id="resetAllBtn">⟳ Làm mới tất cả</button>
    </div>
    <div id="questionsContainer"></div>
    <footer>📖 Dựa trên tài liệu ThS. Vũ Duy Hưng – Tổng hợp lý thuyết + bài tập. Chọn câu trả lời, nhấn "Kiểm tra" để xem kết quả.</footer>
</div>

<script>
    // ----- Dữ liệu câu hỏi (trích từ các chuyên đề) -----
    const questionsData = [
        { // 1
            text: "Chất nào sau đây là alkane?",
            options: ["A. CH₄", "B. C₃H₆", "C. C₄H₆", "D. C₈H₈"],
            correct: "A",
            explanation: "Alkane là hydrocarbon no mạch hở, chỉ có liên kết đơn. CH₄ (methane) thuộc alkane."
        },
        { // 2
            text: "Công thức tổng quát của alkane là:",
            options: ["A. CₙH₂ₙ₊₂ (n ≥ 1)", "B. CₙH₂ₙ (n ≥ 2)", "C. CₙH₂ₙ₋₂ (n ≥ 3)", "D. CₙH₂ₙ₋₆ (n ≥ 6)"],
            correct: "A",
            explanation: "Alkane: CₙH₂ₙ₊₂, mạch hở, liên kết đơn."
        },

            options: ["A. 4", "B. 5", "C. 2", "D. 3"],

            correct: "D",

    // Hàm render toàn bộ câu hỏi
    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        if (!container) return;
        container.innerHTML = '';
        questionsData.forEach((q, idx) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-card';
            questionDiv.setAttribute('data-qid', idx);
            // title + text
            const titleHtml = `
                <div class="question-title">
                    <span class="q-num">Câu ${idx+1}</span>
                    <span class="q-text">${q.text}</span>
                </div>
                <div class="options" id="options-${idx}">
                    ${q.options.map((opt, optIdx) => {
                        const optLetter = String.fromCharCode(65+optIdx); // A,B,C,D
                        return `
                            <label class="option">
                                <input type="radio" name="q${idx}" value="${optLetter}">
                                <span>${opt}</span>
                            </label>
                        `;
                    }).join('')}
                </div>
                <div class="feedback" id="feedback-${idx}">
                    <span class="explain">⚡ Chọn đáp án và nhấn "Kiểm tra"</span>
                    <button class="check-btn" data-idx="${idx}">🔍 Kiểm tra</button>
                </div>
            `;
            questionDiv.innerHTML = titleHtml;
            container.appendChild(questionDiv);
        });

        // Attach event listeners cho các nút kiểm tra
        document.querySelectorAll('.check-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-idx'));
                checkAnswer(idx);
            });
        });
    }

    // Kiểm tra câu trả lời
    function checkAnswer(idx) {
        const q = questionsData[idx];
        const selectedRadio = document.querySelector(`input[name="q${idx}"]:checked`);
        const feedbackDiv = document.getElementById(`feedback-${idx}`);
        if (!feedbackDiv) return;

        if (!selectedRadio) {
            feedbackDiv.innerHTML = `<span class="explain">⚠️ Vui lòng chọn một đáp án (A, B, C hoặc D).</span>
                                     <button class="check-btn" data-idx="${idx}">🔍 Kiểm tra</button>`;
            feedbackDiv.classList.remove('correct', 'wrong');
            // re-attach event cho nút mới
            const newBtn = feedbackDiv.querySelector('.check-btn');
            if(newBtn) newBtn.addEventListener('click', () => checkAnswer(idx));
            return;
        }

        const userAnswer = selectedRadio.value;
        const isCorrect = (userAnswer === q.correct);
        const correctLetter = q.correct;
        const correctAnswerText = q.options.find(opt => opt.startsWith(correctLetter+'.')) || q.options[correctLetter.charCodeAt(0)-65];
        
        if (isCorrect) {
            feedbackDiv.innerHTML = `<span class="explain">✅ Đúng! ${q.explanation}</span>
                                     <button class="check-btn" data-idx="${idx}">🔍 Kiểm tra lại</button>`;
            feedbackDiv.classList.add('correct');
            feedbackDiv.classList.remove('wrong');
        } else {
            feedbackDiv.innerHTML = `<span class="explain">❌ Sai rồi. Đáp án đúng là <strong>${correctLetter}. ${correctAnswerText.substring(2)}</strong>. ${q.explanation}</span>
                                     <button class="check-btn" data-idx="${idx}">🔍 Thử lại</button>`;
            feedbackDiv.classList.add('wrong');
            feedbackDiv.classList.remove('correct');
        }
        // Re-attach event cho button mới (vì innerHTML thay đổi)
        const newBtn = feedbackDiv.querySelector('.check-btn');
        if(newBtn) {
            newBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                checkAnswer(idx);
            });
        }
    }

    // Reset tất cả: xóa lựa chọn radio, reset feedback về trạng thái ban đầu
    function resetAll() {
        for(let i = 0; i < questionsData.length; i++) {
            const radioGroup = document.querySelectorAll(`input[name="q${i}"]`);
            radioGroup.forEach(radio => radio.checked = false);
            const feedbackDiv = document.getElementById(`feedback-${i}`);
            if(feedbackDiv) {
                feedbackDiv.innerHTML = `<span class="explain">⚡ Chọn đáp án và nhấn "Kiểm tra"</span>
                                         <button class="check-btn" data-idx="${i}">🔍 Kiểm tra</button>`;
                feedbackDiv.classList.remove('correct', 'wrong');
                // gắn lại sự kiện
                const btn = feedbackDiv.querySelector('.check-btn');
                if(btn) {
                    btn.addEventListener('click', () => checkAnswer(i));
                }
            }
        }
    }

    // Khởi tạo và gắn reset cho nút
    document.addEventListener('DOMContentLoaded', () => {
        renderQuestions();
        const resetBtn = document.getElementById('resetAllBtn');
        if(resetBtn) {
            resetBtn.addEventListener('click', resetAll);
        }
    });
</script>
</body>
</html>
